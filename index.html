<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMEN — Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --bg: #10151c;
    --panel: #1a222c;
    --panel-line: #262f3a;
    --copper: #d98e4a;
    --copper-dim: #8a5c34;
    --teal: #4fd1c5;
    --text: #eef1f0;
    --muted: #6b7785;
    --danger: #d96a5a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100%;
    overflow-x: hidden;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 24px;
  }

  .brand {
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .brand b { color: var(--copper); font-weight: 600; }

  .status-line {
    font-size: 13px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    height: 20px;
    margin-bottom: 18px;
    text-align: center;
    transition: color 0.3s ease;
  }

  .status-line.listening { color: var(--teal); }
  .status-line.speaking { color: var(--copper); }
  .status-line.error { color: var(--danger); }

  /* 3D ROBOT AVATAR */
  .robot-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 20px;
  }
  .robot-wrap canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .waveform {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 28px;
    margin-bottom: 14px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .waveform.active { opacity: 1; }
  .waveform span {
    width: 4px;
    background: var(--teal);
    border-radius: 2px;
    height: 4px;
    transition: height 0.08s ease-out;
  }

  /* MIC BUTTON */
  .mic-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    margin-bottom: 28px;
  }
  .mic-btn:hover { border-color: var(--copper-dim); }
  .mic-btn:active { transform: scale(0.95); }
  .mic-btn.on {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--bg);
  }
  .mic-btn svg { width: 24px; height: 24px; }

  .mic-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* TRANSCRIPT PANEL */
  .panel {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    flex: 1;
    min-height: 220px;
    max-height: 46vh;
    overflow-y: auto;
    padding: 18px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    line-height: 1.7;
  }

  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: var(--panel-line); border-radius: 3px; }

  .empty-state {
    color: var(--muted);
    font-style: normal;
    padding-top: 8px;
  }

  .turn { margin-bottom: 14px; }
  .turn .who {
    display: block;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .turn.user .who { color: var(--teal); }
  .turn.assistant .who { color: var(--copper); }
  .turn .txt { color: var(--text); white-space: pre-wrap; }

  .controls-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    width: 100%;
    max-width: 560px;
    justify-content: center;
  }

  .ghost-btn {
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--copper-dim); }

  .lang-select {
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  .unsupported {
    max-width: 480px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin-top: 60px;
  }
  .unsupported b { color: var(--copper); }
</style>
</head>
<body>

<div class="app">
  <div class="brand"><b>LUMEN</b> · voice assistant</div>
  <div class="status-line" id="statusLine">tap the mic to start</div>

  <div class="robot-wrap" id="orbWrap"></div>

  <div class="waveform" id="waveform">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <button class="mic-btn" id="micBtn" title="Start listening">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>
  </button>

  <div class="panel" id="panel">
    <div class="empty-state" id="emptyState">Baat karna shuru karne ke liye mic dabayein. Jo bhi bolenge, wo yahan transcript mein dikhega.</div>
  </div>

  <div class="controls-row">
    <select class="lang-select" id="langSelect">
      <option value="hi-IN">हिन्दी (Hindi)</option>
      <option value="en-IN">English (India)</option>
      <option value="en-US">English (US)</option>
    </select>
    <button class="ghost-btn" id="wakeToggleBtn">Wake word: OFF</button>
    <button class="ghost-btn" id="clearBtn">Clear conversation</button>
    <button class="ghost-btn" id="stopSpeakBtn">Stop speaking</button>
  </div>

  <div class="controls-row" style="margin-top:8px;">
    <input type="password" id="apiKeyInput" placeholder="Apni free Gemini API key yahan paste karein" style="flex:1; background:transparent; border:1px solid var(--panel-line); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 10px; border-radius:6px;">
    <button class="ghost-btn" id="saveKeyBtn">Save key</button>
  </div>
  <div style="font-size:11.5px; color:var(--muted); margin-top:6px; text-align:center; max-width:560px;">
    Free key yahan se milegi (Google account se, bina card ke): <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--copper);">aistudio.google.com/app/apikey</a>
  </div>
</div>

<script>
const orbWrap = document.getElementById('orbWrap');
const micBtn = document.getElementById('micBtn');
const statusLine = document.getElementById('statusLine');
const panel = document.getElementById('panel');
const emptyState = document.getElementById('emptyState');
const langSelect = document.getElementById('langSelect');
const clearBtn = document.getElementById('clearBtn');
const stopSpeakBtn = document.getElementById('stopSpeakBtn');

let conversation = []; // {role, parts}
let isListening = false;
let isSpeaking = false;
let recognition = null;
let micLevel = 0;

let wakeEnabled = false;
let recogMode = 'idle'; // 'idle' | 'wake' | 'command'
let wakeDetected = false;
let manualTrigger = false;
const wakeToggleBtn = document.getElementById('wakeToggleBtn');

const WAKE_PHRASES = ['hey lumen', 'hey lumin', 'hi lumen', 'hey loomen', 'hey loomin', 'ok lumen'];
function containsWakeWord(text) {
  const t = text.toLowerCase();
  return WAKE_PHRASES.some(p => t.includes(p));
}

let audioCtx = null, analyser = null, micStream = null;
const waveformEl = document.getElementById('waveform');
const waveformBars = Array.from(waveformEl.querySelectorAll('span'));

async function startWaveform() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    source.connect(analyser);
    waveformEl.classList.add('active');
    pumpWaveform();
  } catch (e) {
    console.error('waveform mic error', e);
  }
}

function pumpWaveform() {
  if (!analyser || !isListening) { micLevel = 0; return; }
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const step = Math.max(1, Math.floor(data.length / waveformBars.length));
  let sum = 0;
  waveformBars.forEach((bar, i) => {
    const val = data[i * step] || 0;
    sum += val;
    bar.style.height = (4 + (val / 255) * 28) + 'px';
  });
  micLevel = (sum / waveformBars.length) / 255;
  requestAnimationFrame(pumpWaveform);
}

function stopWaveform() {
  waveformEl.classList.remove('active');
  waveformBars.forEach(bar => bar.style.height = '4px');
  micLevel = 0;
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
  analyser = null;
}

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

function setState(mode, text) {
  statusLine.className = 'status-line' + (mode === 'listening' ? ' listening' : mode === 'speaking' ? ' speaking' : mode === 'error' ? ' error' : '');
  statusLine.textContent = text;
}

/* ---------- 3D ROBOT ---------- */
let robotHead, eyeL, eyeR, mouth, antennaTip, ring;
const clock = new THREE.Clock();
const COLOR_IDLE = new THREE.Color(0x6b7785);
const COLOR_LISTEN = new THREE.Color(0x4fd1c5);
const COLOR_SPEAK = new THREE.Color(0xd98e4a);

function initRobot3D() {
  const container = orbWrap;
  const w = container.clientWidth || 260;
  const h = container.clientHeight || 260;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 100);
  camera.position.set(0, 0.15, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8a94a0, 0.9));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.6);
  keyLight.position.set(2, 3, 4);
  scene.add(keyLight);
  const copperRim = new THREE.PointLight(0xd98e4a, 1.2, 12);
  copperRim.position.set(-2.5, 1, 2);
  scene.add(copperRim);
  const tealRim = new THREE.PointLight(0x4fd1c5, 1.0, 12);
  tealRim.position.set(2.5, -1, 2);
  scene.add(tealRim);

  const group = new THREE.Group();
  scene.add(group);

  // head shell
  const headGeo = new THREE.SphereGeometry(1.15, 48, 48);
  const headMat = new THREE.MeshStandardMaterial({ color: 0x1a222c, metalness: 0.55, roughness: 0.3 });
  robotHead = new THREE.Mesh(headGeo, headMat);
  robotHead.scale.set(1, 1.05, 0.92);
  group.add(robotHead);

  // face visor (inset, darker, glossy)
  const visorGeo = new THREE.SphereGeometry(0.92, 48, 48, 0, Math.PI * 2, 0, Math.PI * 0.62);
  const visorMat = new THREE.MeshStandardMaterial({ color: 0x0b0f14, metalness: 0.75, roughness: 0.15, side: THREE.DoubleSide });
  const visor = new THREE.Mesh(visorGeo, visorMat);
  visor.rotation.x = Math.PI * 0.62;
  visor.position.set(0, 0.05, 0.42);
  group.add(visor);

  // eyes
  const eyeGeo = new THREE.SphereGeometry(0.13, 24, 24);
  const eyeMat = () => new THREE.MeshStandardMaterial({ color: 0x10151c, emissive: COLOR_IDLE, emissiveIntensity: 1.1, metalness: 0.2, roughness: 0.4 });
  eyeL = new THREE.Mesh(eyeGeo, eyeMat());
  eyeL.position.set(-0.38, 0.12, 0.98);
  group.add(eyeL);
  eyeR = new THREE.Mesh(eyeGeo, eyeMat());
  eyeR.position.set(0.38, 0.12, 0.98);
  group.add(eyeR);

  // mouth
  const mouthGeo = new THREE.BoxGeometry(0.5, 0.08, 0.08);
  const mouthMat = new THREE.MeshStandardMaterial({ color: 0x10151c, emissive: COLOR_IDLE, emissiveIntensity: 1.0, metalness: 0.2, roughness: 0.4 });
  mouth = new THREE.Mesh(mouthGeo, mouthMat);
  mouth.position.set(0, -0.32, 0.98);
  group.add(mouth);

  // antenna
  const stemGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.45, 12);
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x262f3a, metalness: 0.6, roughness: 0.35 });
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.position.set(0, 1.42, 0);
  group.add(stem);

  const tipGeo = new THREE.SphereGeometry(0.09, 20, 20);
  const tipMat = new THREE.MeshStandardMaterial({ color: 0x10151c, emissive: COLOR_IDLE, emissiveIntensity: 1.2 });
  antennaTip = new THREE.Mesh(tipGeo, tipMat);
  antennaTip.position.set(0, 1.68, 0);
  group.add(antennaTip);

  // floating base ring
  const ringGeo = new THREE.TorusGeometry(1.15, 0.035, 16, 64);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x262f3a, metalness: 0.7, roughness: 0.3 });
  ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 - 0.15;
  ring.position.y = -1.15;
  group.add(ring);

  function onResize() {
    const nw = container.clientWidth || 260;
    const nh = container.clientHeight || 260;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  }
  window.addEventListener('resize', onResize);

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // base idle motion: gentle bob + slow yaw
    group.position.y = Math.sin(t * 1.1) * 0.06;
    group.rotation.y = Math.sin(t * 0.5) * 0.25;
    ring.rotation.z = t * 0.3;

    let targetColor = COLOR_IDLE;
    let intensity = 1.0;
    let eyeScaleY = 1;

    if (isListening) {
      targetColor = COLOR_LISTEN;
      intensity = 1.1 + micLevel * 2.2;
      group.rotation.x = 0.06;
      const bump = micLevel * 0.15;
      robotHead.scale.set(1 + bump * 0.3, 1.05 + bump * 0.3, 0.92 + bump * 0.3);
    } else if (isSpeaking) {
      targetColor = COLOR_SPEAK;
      intensity = 1.6;
      group.rotation.x = Math.sin(t * 10) * 0.02;
      mouth.scale.y = 1 + Math.abs(Math.sin(t * 14)) * 3.2;
    } else {
      group.rotation.x = 0;
      mouth.scale.y = 1;
      robotHead.scale.set(1, 1.05, 0.92);
      // idle blink
      const blinkCycle = t % 4.2;
      eyeScaleY = (blinkCycle > 4.0) ? 0.15 : 1;
    }

    eyeL.material.emissive.copy(targetColor);
    eyeR.material.emissive.copy(targetColor);
    mouth.material.emissive.copy(targetColor);
    antennaTip.material.emissive.copy(targetColor);
    eyeL.material.emissiveIntensity = intensity;
    eyeR.material.emissiveIntensity = intensity;
    mouth.material.emissiveIntensity = intensity * 0.8;
    antennaTip.material.emissiveIntensity = intensity;
    eyeL.scale.y = eyeScaleY;
    eyeR.scale.y = eyeScaleY;

    renderer.render(scene, camera);
  }
  animate();
}

try {
  if (window.THREE) {
    initRobot3D();
  }
} catch (e) {
  console.error('3D init failed', e);
}

function addTurn(role, text) {
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'turn ' + role;
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = role === 'user' ? 'AAP' : 'LUMEN';
  const txt = document.createElement('div');
  txt.className = 'txt';
  txt.textContent = text;
  div.appendChild(who);
  div.appendChild(txt);
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
}

let geminiApiKey = '';

const STORAGE_KEY = 'lumen-conversation';

async function saveConversation() {
  try {
    const payload = JSON.stringify(conversation);
    if (window.storage && typeof window.storage.set === 'function') {
      await window.storage.set(STORAGE_KEY, payload);
    } else {
      localStorage.setItem(STORAGE_KEY, payload);
    }
  } catch (e) {
    console.error('save failed', e);
  }
}

async function loadConversation() {
  try {
    if (window.storage && typeof window.storage.get === 'function') {
      const res = await window.storage.get(STORAGE_KEY);
      return res && res.value ? JSON.parse(res.value) : null;
    } else {
      const val = localStorage.getItem(STORAGE_KEY);
      return val ? JSON.parse(val) : null;
    }
  } catch (e) {
    return null;
  }
}

async function clearSavedConversation() {
  try {
    if (window.storage && typeof window.storage.delete === 'function') {
      await window.storage.delete(STORAGE_KEY);
    } else {
      localStorage.removeItem(STORAGE_KEY);
    }
  } catch (e) { /* ignore */ }
}

async function restoreConversation() {
  const saved = await loadConversation();
  if (saved && Array.isArray(saved) && saved.length) {
    conversation = saved;
    conversation.forEach(turn => {
      const text = turn.parts && turn.parts[0] ? turn.parts[0].text : '';
      addTurn(turn.role === 'model' ? 'assistant' : 'user', text);
    });
  }
}

async function askClaude(userText) {
  if (!geminiApiKey) {
    return "Pehle apni free Gemini API key 'Save key' box mein daalein — upar link se milegi.";
  }

  conversation.push({ role: 'user', parts: [{ text: userText }] });

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?Ket=${geminiApiKey}',
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: "You are LUMEN, a warm, concise voice assistant speaking out loud through text-to-speech. Keep replies short (2-4 sentences unless asked for detail), conversational, and easy to speak aloud. Match the language the user speaks in (Hindi, Hinglish, or English)." }]
          },
          contents: conversation
        })
      }
    );

    if (!response.ok) {
      const errBody = await response.text();
      throw new Error('API error ' + response.status + ': ' + errBody.slice(0, 150));
    }

    const data = await response.json();
    const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf kijiye, mujhe jawab samajh nahi aaya.";

    conversation.push({ role: 'model', parts: [{ text: replyText }] });
    saveConversation();
    return replyText;
  } catch (err) {
    console.error(err);
    return "Error: " + err.message;
  }
}

function speak(text) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = langSelect.value;
  utter.rate = 1.02;
  utter.pitch = 1.0;

  utter.onstart = () => {
    isSpeaking = true;
    setState('speaking', 'bol raha hoon…');
  };
  utter.onend = () => {
    isSpeaking = false;
    if (wakeEnabled) {
      setState('listening', 'wake word ka intezaar… "Hey Lumen" boliye');
      setTimeout(() => startWakeListening(), 300);
    } else {
      recogMode = 'idle';
      setState('idle', 'tap the mic to continue');
    }
  };
  utter.onerror = () => {
    isSpeaking = false;
    if (wakeEnabled) {
      setTimeout(() => startWakeListening(), 300);
    } else {
      recogMode = 'idle';
      setState('idle', 'tap the mic to continue');
    }
  };

  window.speechSynthesis.speak(utter);
}

function startWakeListening() {
  if (!recognition) return;
  recogMode = 'wake';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = langSelect.value;
  try { recognition.start(); } catch (e) { /* likely already running */ }
}

function initRecognition() {
  recognition = new SpeechRecognitionAPI();
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('on');
    if (recogMode === 'wake') {
      setState('listening', 'wake word ka intezaar… "Hey Lumen" boliye');
    } else {
      setState('listening', 'sun raha hoon…');
    }
    startWaveform();
  };

  recognition.onresult = async (event) => {
    if (recogMode === 'wake') {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (containsWakeWord(transcript)) {
          wakeDetected = true;
          try { recognition.stop(); } catch (e) {}
          break;
        }
      }
      return;
    }
    // command mode
    const transcript = event.results[0][0].transcript;
    addTurn('user', transcript);
    setState('idle', 'soch raha hoon…');
    const reply = await askClaude(transcript);
    addTurn('assistant', reply);
    speak(reply);
  };

  recognition.onerror = (event) => {
    isListening = false;
    micBtn.classList.remove('on');
    stopWaveform();
    if (event.error === 'not-allowed' || event.error === 'permission-denied') {
      wakeEnabled = false;
      wakeToggleBtn.textContent = 'Wake word: OFF';
      recogMode = 'idle';
      setState('error', 'microphone access denied — check browser permissions');
      return;
    }
    if (recogMode === 'wake') return; // silence/network hiccups during passive listening — ignore, onend will restart
    if (event.error === 'no-speech') {
      setState('idle', 'kuch suna nahi — dobara koshish karein');
    } else {
      setState('error', 'error: ' + event.error);
    }
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('on');
    stopWaveform();

    if (recogMode === 'wake') {
      if (wakeDetected || manualTrigger) {
        wakeDetected = false;
        manualTrigger = false;
        recogMode = 'command';
        recognition.continuous = false;
        recognition.interimResults = false;
        setTimeout(() => { try { recognition.start(); } catch (e) {} }, 200);
      } else if (wakeEnabled) {
        setTimeout(() => { try { recognition.start(); } catch (e) {} }, 300);
      } else {
        recogMode = 'idle';
        setState('idle', 'tap the mic to continue');
      }
      return;
    }

    if (recogMode === 'command') {
      if (!isSpeaking) {
        if (wakeEnabled) {
          setTimeout(() => startWakeListening(), 400);
        } else {
          recogMode = 'idle';
          setState('idle', 'tap the mic to continue');
        }
      }
      return;
    }

    if (!isSpeaking) setState('idle', 'tap the mic to continue');
  };
}

micBtn.addEventListener('click', () => {
  if (!recognition) {
    setState('error', 'speech recognition load nahi hua — page reload karein');
    return;
  }
  if (isListening) {
    if (recogMode === 'wake') manualTrigger = true;
    recognition.stop();
  } else {
    recogMode = 'command';
    recognition.continuous = false;
    recognition.interimResults = false;
    window.speechSynthesis.cancel();
    recognition.lang = langSelect.value;
    try {
      recognition.start();
    } catch (e) {
      if (e.name === 'InvalidStateError') {
        // recognition already running somewhere — reset and retry once
        try { recognition.abort(); } catch (e2) {}
        setTimeout(() => {
          try { recognition.start(); } catch (e3) {
            setState('error', 'start error: ' + e3.message);
          }
        }, 150);
      } else {
        setState('error', 'start error: ' + e.message);
      }
    }
  }
});

wakeToggleBtn.addEventListener('click', () => {
  if (!recognition) {
    setState('error', 'speech recognition load nahi hua — page reload karein');
    return;
  }
  wakeEnabled = !wakeEnabled;
  wakeToggleBtn.textContent = 'Wake word: ' + (wakeEnabled ? 'ON' : 'OFF');
  if (wakeEnabled) {
    if (!isListening && !isSpeaking && recogMode === 'idle') {
      startWakeListening();
    }
  } else {
    if (recogMode === 'wake' && isListening) {
      recognition.stop();
    }
  }
});

document.getElementById('saveKeyBtn').addEventListener('click', () => {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (val) {
    geminiApiKey = val;
    setState('idle', 'key saved — tap the mic to start');
  }
});

clearBtn.addEventListener('click', () => {
  conversation = [];
  panel.innerHTML = '';
  panel.appendChild(emptyState);
  emptyState.style.display = 'block';
  clearSavedConversation();
  setState('idle', 'conversation cleared');
});

stopSpeakBtn.addEventListener('click', () => {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  setState('idle', 'tap the mic to continue');
});

const isSecure = window.isSecureContext === true;

if (!SpeechRecognitionAPI) {
  document.querySelector('.app').innerHTML = `
    <div class="brand"><b>LUMEN</b> · voice assistant</div>
    <div class="unsupported">
      Aapka browser <b>speech recognition</b> support nahi karta.<br><br>
      Ye feature <b>iPhone/iOS par kisi bhi browser mein kaam nahi karta</b> (Apple ne block kiya hua hai).
      Android par <b>Google Chrome</b> use karein, ya desktop Chrome/Edge par kholein.
    </div>`;
} else if (!isSecure) {
  document.querySelector('.app').innerHTML = `
    <div class="brand"><b>LUMEN</b> · voice assistant</div>
    <div class="unsupported">
      Mic sirf <b>secure (https)</b> page par kaam karta hai.<br><br>
      Ye file agar seedhe download karke file:// se kholi gayi hai, toh mic block ho jaata hai.
      Kripya is page ko Claude ke <b>preview link</b> se, ek naye Chrome tab mein (embedded preview ke bahar) kholein.
    </div>`;
} else {
  try {
    initRecognition();
  } catch (e) {
    setState('error', 'init error: ' + e.message);
  }
  restoreConversation();
}
</script>

</body>
</html>
